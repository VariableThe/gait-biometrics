[project]
name = "gait-biometrics-research"
version = "0.1.0"
description = "Reproducible IMU gait authentication experiments"
requires-python = ">=3.14,<3.15"
dependencies = [
  "torch==2.14.1",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "pyyaml==6.0.3",
  "matplotlib==3.11.2",
  "onnx==1.23.2",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1; sys_platform == 'linux' or sys_platform == 'win32'"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "scipy==1.18.1",
  "onnxruntime==1.31.0",
  "ruff==0.17.1",
  "ty==0.0.90",
  "pip-audit==2.10.1",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
