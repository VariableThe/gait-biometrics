model: multitask           # registry key
source: har                # har | wisdm — multitask needs HAR (has subject ids)
window_size: 128
stride: 64
batch_size: 64
epochs: 2
subset: 5000
optimizer: adam
lr: 0.001
weight_decay: 0.0
class_weight: balanced     # or null
seed: 42
num_workers: 0
torch_threads: 4
out_dir: runs/smoke_classification
model_args:
  n_channels: 9
  n_classes: 6
  n_subjects: 21           # HAR train split has 21 subjects (ids 0-20)
  hidden_dim: 128
  dropout: 0.3
