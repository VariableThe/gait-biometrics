model: cnn_lstm            # registry key — "siamese" is NOT a registry key;
                           # a separate training script trains the SiameseNet.
source: har                # har | wisdm — siamese needs HAR (has subject ids)
window_size: 128
stride: 64
batch_size: 64
epochs: 2
subset: 2000
optimizer: adam
lr: 0.001
weight_decay: 0.0
class_weight: balanced     # or null
seed: 42
num_workers: 0
torch_threads: 4
out_dir: runs/smoke_verification/siamese
loss_type: triplet         # triplet | contrastive (consumed by the siamese script)
model_args:
  n_channels: 9
  embed_dim: 128
  dropout: 0.3
  margin: 1.0
