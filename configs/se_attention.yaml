model: se_convnet          # registry key
source: har                # har | wisdm
window_size: 128
stride: 64
batch_size: 64
epochs: 2
subset: 2000
optimizer: adam
lr: 0.001
weight_decay: 0.0
class_weight: balanced     # or null
seed: 42
num_workers: 0
torch_threads: 4
out_dir: runs/smoke_verification/se_attention
model_args:
  n_channels: 9
  n_classes: 6
  use_depthwise: true
  dropout: 0.3
  reduction: 16
